# Secrets come from a `.env` file next to this compose file on the server (never committed).
# Template: infra/docker/.env.prod.example. Missing required values abort `docker compose up`.
# Memory: limits below add up to ~2.7 GB on the 8 GB VPS; idle use is well under 1.5 GB. Swap is only a safety net.
# Point the DNS record for SITE_ADDRESS at the server; Caddy needs ports 80 and 443 free (no host nginx in front).
services:
  postgres:
    image: postgres:16-alpine
    command:
      - postgres
      - -c
      - shared_buffers=256MB
      - -c
      - effective_cache_size=768MB
      - -c
      - work_mem=8MB
      - -c
      - maintenance_work_mem=64MB
      - -c
      - max_connections=50
    shm_size: 256mb
    environment:
      POSTGRES_USER: "${POSTGRES_USER:-postgres}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}"
      POSTGRES_DB: "${POSTGRES_DB:-career_navigator}"
    ports:
      # Reachable only from the server itself (use an SSH tunnel for admin access).
      - "127.0.0.1:5433:5432"
    volumes:
      - cn-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 20
    cpus: 1
    mem_limit: 768m
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    # BullMQ requires noeviction; every other key the API writes has a TTL.
    command:
      - redis-server
      - --requirepass
      - "${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}"
      - --maxmemory
      - 192mb
      - --maxmemory-policy
      - noeviction
    environment:
      REDISCLI_AUTH: "${REDIS_PASSWORD}"
    ports:
      - "127.0.0.1:6380:6379"
    volumes:
      - cn-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20
    cpus: 0.5
    mem_limit: 256m
    restart: unless-stopped

  # Applies pending Prisma migrations once per deploy, then exits (separate image: the API image has no Prisma CLI).
  # First deploy on a database created by the old `prisma db push`: run once
  #   docker compose run --rm migrate npx prisma migrate resolve --applied 0_init
  migrate:
    image: ${DOCKERHUB_USER:?set DOCKERHUB_USER}/career-navigator-migrate:${TAG:?set TAG to the image tag (git SHA)}
    environment:
      DATABASE_URL: "postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-career_navigator}?schema=public"
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    image: ${DOCKERHUB_USER:?set DOCKERHUB_USER}/career-navigator-api:${TAG:?set TAG to the image tag (git SHA)}
    environment:
      NODE_ENV: production
      PORT: 3000
      NODE_OPTIONS: "--max-old-space-size=384"
      JWT_ACCESS_SECRET: "${JWT_ACCESS_SECRET:?set JWT_ACCESS_SECRET in .env}"
      JWT_ACCESS_EXPIRES_IN: "${JWT_ACCESS_EXPIRES_IN:-15m}"
      JWT_REFRESH_SECRET: "${JWT_REFRESH_SECRET:?set JWT_REFRESH_SECRET in .env}"
      JWT_REFRESH_EXPIRES_IN: "${JWT_REFRESH_EXPIRES_IN:-30d}"

      DATABASE_URL: "postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-career_navigator}?schema=public"
      REDIS_URL: "redis://:${REDIS_PASSWORD}@redis:6379"

      MINIO_ENDPOINT: "http://minio:9000"
      MINIO_ACCESS_KEY: "${MINIO_ROOT_USER:?set MINIO_ROOT_USER in .env}"
      MINIO_SECRET_KEY: "${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in .env}"
      MINIO_BUCKET: "${MINIO_BUCKET:-resumes}"

      OTP_EMAIL_LOG_ONLY: "false"
      BREVO_API_KEY: "${BREVO_API_KEY:?set BREVO_API_KEY in .env}"
      BREVO_SENDER_EMAIL: "${BREVO_SENDER_EMAIL:?set BREVO_SENDER_EMAIL in .env}"

      GEMINI_API_KEY: "${GEMINI_API_KEY:-}"
      OLLAMA_API_KEY: "${OLLAMA_API_KEY:-}"
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:-}"
      OPENROUTER_API_KEY: "${OPENROUTER_API_KEY:-}"
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      AI_JOB_MATCH_ENABLED: "${AI_JOB_MATCH_ENABLED:-false}"
      AI_USER_DAILY_LIMIT_CHAT: "${AI_USER_DAILY_LIMIT_CHAT:-40}"
      AI_BYOK_ENABLED: "${AI_BYOK_ENABLED:-false}"
      AI_KEY_ENCRYPTION_KEY: "${AI_KEY_ENCRYPTION_KEY:-}"
      AI_KEY_ENCRYPTION_KEY_PREVIOUS: "${AI_KEY_ENCRYPTION_KEY_PREVIOUS:-}"

      CV_SCAN_ENABLED: "true"
      CV_SCAN_WORKER_CONCURRENCY: "1"
      CV_DEFAULT_PHONE_COUNTRY: "${CV_DEFAULT_PHONE_COUNTRY:-CM}"
      CV_AI_ASSIST_ENABLED: "${CV_AI_ASSIST_ENABLED:-true}"
      CV_OCR_SERVER: "${CV_OCR_SERVER:-false}"
      AGORA_APP_ID: "${AGORA_APP_ID:-}"
      AGORA_APP_CERTIFICATE: "${AGORA_APP_CERTIFICATE:-}"
      CORS_ALLOWED_ORIGINS: "${CORS_ALLOWED_ORIGINS:-https://${SITE_ADDRESS}}"
      TRUST_PROXY: "1"
      SWAGGER_ENABLED: "${SWAGGER_ENABLED:-false}"
      SWAGGER_USER: "${SWAGGER_USER:-}"
      SWAGGER_PASSWORD: "${SWAGGER_PASSWORD:-}"
    ports:
      # Server-local only (health checks, debugging); the public entry point is the proxy.
      - "127.0.0.1:3001:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
    cpus: 1
    mem_limit: 640m
    restart: unless-stopped

  web:
    image: ${DOCKERHUB_USER:?set DOCKERHUB_USER}/career-navigator-web:${TAG:?set TAG to the image tag (git SHA)}
    environment:
      NODE_ENV: production
      NODE_OPTIONS: "--max-old-space-size=256"
    depends_on:
      api:
        condition: service_healthy
    cpus: 0.5
    mem_limit: 384m
    restart: unless-stopped

  # The only public service: HTTPS for SITE_ADDRESS (certificates from Let's Encrypt), /api + /socket.io -> api.
  proxy:
    image: caddy:2-alpine
    environment:
      SITE_ADDRESS: "${SITE_ADDRESS:?set SITE_ADDRESS (your domain) in .env}"
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - cn-caddy-data:/data
      - cn-caddy-config:/config
    depends_on:
      web:
        condition: service_healthy
    cpus: 0.25
    mem_limit: 128m
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: "${MINIO_ROOT_USER:?set MINIO_ROOT_USER in .env}"
      MINIO_ROOT_PASSWORD: "${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in .env}"
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - cn-minio:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9000/minio/health/live >/dev/null || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
    cpus: 1
    mem_limit: 512m
    restart: unless-stopped

volumes:
  cn-postgres:
  cn-redis:
  cn-minio:
  cn-caddy-data:
  cn-caddy-config:
