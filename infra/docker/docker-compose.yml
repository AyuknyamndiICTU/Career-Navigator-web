# Host ports can be changed in infra/docker/.env when they clash with other projects (Postgres defaults to 5435, Redis to 6382).
name: career-navigator

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: career_navigator
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5435}:5432"
    volumes:
      - cn-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 20
    cpus: 1
    mem_limit: 512m
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:${REDIS_HOST_PORT:-6382}:6379"
    volumes:
      - cn-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20
    cpus: 0.5
    mem_limit: 256m
    restart: unless-stopped

  # Applies pending Prisma migrations once, then exits; the API starts only after it succeeds.
  migrate:
    image: career-navigator-migrate:local
    build:
      context: ../../
      dockerfile: apps/api/Dockerfile
      target: migrate
    environment:
      DATABASE_URL: "postgresql://postgres:postgres@postgres:5432/career_navigator?schema=public"
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    image: career-navigator-api:local
    build:
      context: ../../
      dockerfile: apps/api/Dockerfile
      args:
        WITH_OCR: "${CV_OCR_SERVER:-false}"
    environment:
      # Local stack: allows log-only OTPs and enables Swagger; production settings live in docker-compose.prod.yml.
      NODE_ENV: development
      PORT: 3000
      # Local http only; production keeps Secure cookies.
      COOKIE_SECURE: "false"

      # JWT
      JWT_ACCESS_SECRET: "dev-access-secret"
      JWT_ACCESS_EXPIRES_IN: "2h"
      JWT_REFRESH_SECRET: "dev-refresh-secret"
      JWT_REFRESH_EXPIRES_IN: "30d"

      # DB
      DATABASE_URL: "postgresql://postgres:postgres@postgres:5432/career_navigator?schema=public"

      # Redis (BullMQ + socket adapter)
      REDIS_URL: "redis://redis:6379"

      # File storage: the local Garage node below (production uses Cloudflare R2 with the same S3_* settings).
      S3_ENDPOINT: "http://garage:3900"
      S3_PUBLIC_ENDPOINT: "http://localhost:${GARAGE_HOST_PORT:-3900}"
      S3_REGION: "garage"
      S3_BUCKET: "career-navigator"
      S3_ACCESS_KEY_ID: "GK1c0de0de0c0ffee000000001"
      S3_SECRET_ACCESS_KEY: "6c6f63616c2d6465762d6761726167652d7365637265742d6368616e67652d6d"
      STORAGE_LIFECYCLE_ENABLED: "true"

      # OTP: keep log-only by default to avoid Brevo charges
      OTP_EMAIL_LOG_ONLY: "true"
      BREVO_API_KEY: "dev"
      BREVO_SENDER_EMAIL: "no-reply@example.com"

      # Cloud AI only (nothing runs locally). Keys come from infra/docker/.env; providers without a key are skipped.
      GEMINI_API_KEY: "${GEMINI_API_KEY:-}"
      OLLAMA_API_KEY: "${OLLAMA_API_KEY:-}"
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:-}"
      OPENROUTER_API_KEY: "${OPENROUTER_API_KEY:-}"
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      AI_JOB_MATCH_ENABLED: "${AI_JOB_MATCH_ENABLED:-false}"
      # Users' own keys (Settings → AI providers); needs a 32-byte base64 key: openssl rand -base64 32
      AI_BYOK_ENABLED: "${AI_BYOK_ENABLED:-false}"
      AI_KEY_ENCRYPTION_KEY: "${AI_KEY_ENCRYPTION_KEY:-}"

      # BullMQ CV scan worker defaults (rule-based parser; AI only when the user asks)
      CV_SCAN_ENABLED: "true"
      CV_SCAN_WORKER_CONCURRENCY: "1"
      CV_DEFAULT_PHONE_COUNTRY: "${CV_DEFAULT_PHONE_COUNTRY:-CM}"
      CV_AI_ASSIST_ENABLED: "${CV_AI_ASSIST_ENABLED:-true}"
      CV_OCR_SERVER: "${CV_OCR_SERVER:-false}"

      # Video calls: the local LiveKit server below, reached through the proxy at /rtc (dev keys only).
      LIVEKIT_URL: "ws://localhost:${WEB_HOST_PORT:-3000}"
      LIVEKIT_API_KEY: "devkey"
      LIVEKIT_API_SECRET: "local-dev-livekit-secret-change-me-0123456789"

      # CORS for browser
      CORS_ALLOWED_ORIGINS: "http://localhost:${WEB_HOST_PORT:-3000}"
      # Requests arrive through the Caddy proxy; real client IPs come from X-Forwarded-For.
      TRUST_PROXY: "1"
    ports:
      # Direct API access for tools and Swagger (/api/docs); the browser uses the proxy.
      - "127.0.0.1:${API_HOST_PORT:-3001}:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      garage:
        condition: service_healthy
    cpus: 1
    mem_limit: 1024m
    restart: unless-stopped

  web:
    image: career-navigator-web:local
    build:
      context: ../../
      dockerfile: apps/web/web-ui/Dockerfile
    environment:
      NODE_ENV: production
    depends_on:
      api:
        condition: service_healthy
    cpus: 0.5
    mem_limit: 512m
    restart: unless-stopped

  # Single browser origin: http://localhost:${WEB_HOST_PORT} serves the web app, /api and /socket.io.
  proxy:
    image: caddy:2-alpine
    environment:
      SITE_ADDRESS: ":80"
    ports:
      - "${WEB_HOST_PORT:-3000}:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      web:
        condition: service_healthy
    cpus: 0.25
    mem_limit: 128m
    restart: unless-stopped

  # Self-hosted LiveKit SFU (same server as LiveKit Cloud). Signaling via the proxy (/rtc); media on 7881/tcp + 7882/udp.
  livekit:
    image: livekit/livekit-server:v1.13.10
    environment:
      LIVEKIT_CONFIG: |
        port: 7880
        rtc:
          tcp_port: 7881
          udp_port: 7882
          node_ip: 127.0.0.1
          use_external_ip: false
        keys:
          devkey: local-dev-livekit-secret-change-me-0123456789
        webhook:
          api_key: devkey
          urls:
            - http://api:3000/api/video/webhook
        room:
          empty_timeout: 120
          departure_timeout: 20
        logging:
          level: info
    ports:
      - "127.0.0.1:7881:7881"
      - "127.0.0.1:7882:7882/udp"
    cpus: 0.5
    mem_limit: 256m
    restart: unless-stopped

  # Local S3-compatible storage (Garage, single node). Creates the private bucket and the dev key on start.
  garage:
    image: dxflrs/garage:v2.4.1
    command: ["/garage", "server", "--single-node", "--default-bucket"]
    environment:
      GARAGE_DEFAULT_ACCESS_KEY: "GK1c0de0de0c0ffee000000001"
      GARAGE_DEFAULT_SECRET_KEY: "6c6f63616c2d6465762d6761726167652d7365637265742d6368616e67652d6d"
      GARAGE_DEFAULT_BUCKET: "career-navigator"
    volumes:
      - ./garage.toml:/etc/garage.toml:ro
      - cn-garage-meta:/var/lib/garage/meta
      - cn-garage-data:/var/lib/garage/data
    ports:
      # Browsers fetch presigned downloads here (S3_PUBLIC_ENDPOINT).
      - "127.0.0.1:${GARAGE_HOST_PORT:-3900}:3900"
    healthcheck:
      test: ["CMD", "/garage", "status"]
      interval: 5s
      timeout: 5s
      retries: 20
    cpus: 0.5
    mem_limit: 256m
    restart: unless-stopped

volumes:
  cn-postgres:
  cn-redis:
  cn-garage-meta:
  cn-garage-data:
