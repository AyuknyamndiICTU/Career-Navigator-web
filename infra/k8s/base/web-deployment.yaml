apiVersion: apps/v1
kind: Deployment
metadata:
  name: cn-web
  labels:
    app: cn-web
spec:
  replicas: 2
  selector:
    matchLabels:
      app: cn-web
  strategy:
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: cn-web
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: cn-web
          # The image has no API address baked in: the ingress serves /api and /socket.io from cn-api on the same host.
          image: cn-web
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: NODE_ENV
              value: "production"
            - name: NODE_OPTIONS
              value: "--max-old-space-size=256"
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 384Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          readinessProbe:
            httpGet:
              path: /auth/login
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /auth/login
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
