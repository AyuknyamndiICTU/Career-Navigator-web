apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cn-ingress
  labels:
    app: cn
  annotations:
    # cert-manager issues and renews the TLS certificate (ClusterIssuer name per cluster; see ../README.md).
    cert-manager.io/cluster-issuer: letsencrypt
    # ingress-nginx: long-lived Socket.IO websockets and AI SSE streams, 10 MB CV uploads.
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
    nginx.ingress.kubernetes.io/proxy-body-size: "12m"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - app.example.com # set per overlay
      secretName: cn-tls
  rules:
    - host: app.example.com # set per overlay
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: cn-api
                port:
                  number: 80
          - path: /socket.io
            pathType: Prefix
            backend:
              service:
                name: cn-api
                port:
                  number: 80
          - path: /
            pathType: Prefix
            backend:
              service:
                name: cn-web
                port:
                  number: 80
