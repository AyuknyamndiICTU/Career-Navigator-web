apiVersion: apps/v1
kind: Deployment
metadata:
  name: cn-api
  labels:
    app: cn-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: cn-api
  strategy:
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: cn-api
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000 # `node` in the image
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: cn-api
          # Tag = git SHA, set per overlay/release with `kustomize edit set image`.
          image: cn-api
          ports:
            - name: http
              containerPort: 3000
          # Non-secret settings: configMapGenerator in kustomization.yaml; secrets: overlay secretGenerator.
          envFrom:
            - configMapRef:
                name: cn-api-config
            - secretRef:
                name: cn-api-secrets
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 640Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          startupProbe:
            httpGet:
              path: /api/health/live
              port: http
            periodSeconds: 5
            failureThreshold: 24
          readinessProbe:
            httpGet:
              path: /api/health/ready
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /api/health/live
              port: http
            periodSeconds: 20
            timeoutSeconds: 5
